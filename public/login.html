<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema - Clínica Vital SpA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --clinic-primary: #0284c7;
      --clinic-primary-dark: #0369a1;
      --clinic-mint: #059669;
      --clinic-navy: #1e3a8a;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      position: relative;
      overflow-x: hidden;
      background-color: #e0f2fe;
    }

    /* Capa de fotografía clínica arquitectónica */
    .clinic-bg-photo {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(135deg, rgba(240, 249, 255, 0.72) 0%, rgba(255, 255, 255, 0.58) 50%, rgba(236, 253, 245, 0.72) 100%),
        url('/images/clinica_bg.jpg'),
        url('/images/clinica_bg.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 0;
      animation: slowZoom 24s ease-in-out infinite alternate;
    }

    @keyframes slowZoom {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    /* Elementos decorativos sutiles flotantes */
    .clinic-glow {
      position: fixed;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(2, 132, 199, 0.14) 0%, transparent 70%);
      top: -120px;
      right: -120px;
      z-index: 1;
      pointer-events: none;
    }

    .login-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 460px;
      padding: 16px;
      animation: fadeSlideUp 0.65s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-login {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-top: 5px solid var(--clinic-primary);
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12), 0 4px 16px rgba(2, 132, 199, 0.08);
    }

    .brand-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 14px;
      border-radius: 18px;
      background: linear-gradient(135deg, #0284c7 0%, #0ea5e9 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.85rem;
      box-shadow: 0 10px 24px rgba(2, 132, 199, 0.28);
    }

    .form-control-clinic {
      background-color: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      color: #0f172a;
      transition: all 0.2s ease;
    }

    .form-control-clinic:focus {
      background-color: #ffffff;
      border-color: var(--clinic-primary);
      box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.14);
    }

    .btn-clinic-submit {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-weight: 700;
      letter-spacing: 0.3px;
      padding: 13px;
      transition: all 0.25s ease;
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.25);
    }

    .btn-clinic-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(2, 132, 199, 0.35);
      background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
      color: #ffffff;
    }

    .quick-role-btn {
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 7px 10px;
      transition: all 0.2s ease;
      background: #ffffff;
    }

    .quick-role-btn:hover {
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div class="clinic-bg-photo"></div>
  <div class="clinic-glow"></div>

  <div class="login-wrapper">
    <div class="card-login text-center">
      <div class="brand-icon">🏥</div>
      <span class="badge rounded-pill bg-primary-subtle text-primary border border-primary-subtle px-3 py-1 mb-2 fw-semibold">
        Plataforma Clínica Digital
      </span>
      <h3 class="fw-bold mb-1 text-dark">Clínica Vital SpA</h3>
      <p class="text-secondary small mb-4">Gestión de Inventario Valorizado, Turnos y Fichas QR</p>

      <div id="alert-error" class="alert alert-danger d-none py-2 small rounded-3 border-danger-subtle" role="alert">
        ⚠️ Usuario o contraseña incorrectos, o acceso revocado.
      </div>

      <form id="login-form">
        <div class="form-floating mb-3 text-start">
          <input type="text" class="form-control form-control-clinic" id="username" placeholder="Usuario" required autocomplete="username">
          <label for="username" class="text-secondary">👤 Usuario asignado</label>
        </div>

        <div class="input-group mb-4">
          <div class="form-floating flex-grow-1 text-start">
            <input type="password" class="form-control form-control-clinic" style="border-top-right-radius: 0; border-bottom-right-radius: 0;" id="password" placeholder="Contraseña" required autocomplete="current-password">
            <label for="password" class="text-secondary">🔒 Contraseña</label>
          </div>
          <button type="button" id="toggle-pass" class="btn btn-light border border-start-0 text-secondary px-3" style="border-top-right-radius: 12px; border-bottom-right-radius: 12px; border-color: #cbd5e1;" title="Mostrar u ocultar contraseña">
            👁️
          </button>
        </div>

        <button type="submit" id="btn-submit-login" class="btn btn-clinic-submit w-100 fs-6">
          Ingresar al Sistema →
        </button>
      </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    sessionStorage.clear();

    document.getElementById('toggle-pass').addEventListener('click', () => {
      const passInput = document.getElementById('password');
      passInput.type = passInput.type === 'password' ? 'text' : 'password';
    });

    function autocompletarDemo(u, p) {
      document.getElementById('username').value = u;
      document.getElementById('password').value = p;
      document.getElementById('alert-error').classList.add('d-none');
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const usernameInput = document.getElementById('username').value;
      const passwordInput = document.getElementById('password').value;
      const btnSubmit = document.getElementById('btn-submit-login');

      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Verificando credenciales...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: usernameInput, password: passwordInput })
        });

        const data = await res.json();
        if (data.success) {
          sessionStorage.setItem('authenticated', 'true');
          sessionStorage.setItem('userId', data.id);
          sessionStorage.setItem('role', data.role);
          sessionStorage.setItem('username', data.nombreUsuario || usernameInput);
          sessionStorage.setItem('userKey', data.userKey || usernameInput);
          sessionStorage.setItem('cargo', data.cargo || 'Personal Clínico');
          sessionStorage.setItem('temaVisual', data.temaVisual || 'tens');
          sessionStorage.setItem('permisos', JSON.stringify(data.permisos || {}));
          window.location.href = 'index.html';
        } else {
          const alertBox = document.getElementById('alert-error');
          alertBox.textContent = `⚠️ ${data.message || 'Usuario o contraseña incorrectos.'}`;
          alertBox.classList.remove('d-none');
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Ingresar al Sistema →';
        }
      } catch (error) {
        console.error('Error al iniciar sesión:', error);
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Ingresar al Sistema →';
      }
    });
  </script>
</body>
</html>
